line-length = 120

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long
    "E402", # CLI scripts insert repo root into sys.path before local imports
]

[format]
quote-style = "double"
indent-style = "space"
